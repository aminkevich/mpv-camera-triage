# Settings of make_clips.py and make_timeline.py (they share the segment plan).
# The file is read automatically if it is next to the scripts;
# another file: py make_clips.py FOLDER --config path\to\file.conf
# For the timeline the pads, merging and selection matter; out and reencode_* are for cutting only.
#
# Format: key = value. Comments start with # or ;
# Priority: built-in values → this file → command line.
# A commented-out line = the built-in value (shown in the example).
# On startup the script prints the resulting settings — handy for checking.

# ---------------------------------------------------------------- point mark pads
# Seconds before and after a mark (for all labels without their own line below)
 #pad_before = 7
 #pad_after  = 6

# Per-label pads: pad.<label> = before/after   or   pad.<label> = N  (the same on both sides).
# Labels: highlight scenery people fish shot catch wildlife dive jump trick crash ride
# --pad-before / --pad-after on the command line override these values too.
# pad.shot    = 6/3
# pad.catch   = 3/6
# pad.scenery = 4
# pad.people  = 7
 # pad.jump  = 10

# ---------------------------------------------------------------- i/o clips and merging
# Margin around i/o ranges, seconds
# clip_pad = 0.5
# Merge segments of one file if the gap between them is ≤ N seconds
# merge_gap = 2

# ---------------------------------------------------------------- selection
# Labels that produce no clips (comma-separated)
# exclude = bad
# Point labels that produce no clips on their own (inside i/o they only add a label)
# point_exclude = dive
# Only files rated ≥ N. Empty/commented out — everything except rating 0; 0 — everything
# min_rating = 2

# ---------------------------------------------------------------- output
# Clip subfolder inside the footage folder — or a full path (out = D:\Project\Clips):
# then the videos and _triage.csv stay in the footage folder, no need to copy them to the project.
# A full path with several footage folders — clips in subfolders by their paths.
# out = Clips

# ---------------------------------------------------------------- --reencode
# H.264 quality: lower is better and a larger file (18 ≈ visually lossless, 23 — the default)
# reencode_crf = 18
# Encoding speed: ultrafast superfast veryfast faster fast medium slow slower veryslow
# reencode_preset = medium
