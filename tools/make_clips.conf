# Настройки make_clips.py. Файл читается автоматически, если лежит рядом со скриптом;
# другой файл: py make_clips.py ПАПКА --config путь\к\файлу.conf
#
# Формат: ключ = значение. Комментарии начинаются с # или ;
# Приоритет: встроенные значения → этот файл → командная строка.
# Закомментированная строка = встроенное значение (указано в примере).
# Скрипт при запуске печатает итоговые настройки — по ним удобно проверять.

# ---------------------------------------------------------------- отступы точечных меток
# Секунд до и после метки (для всех меток, у которых нет своей строки ниже)
 #pad_before = 7
 #pad_after  = 6

# Отступы по меткам: pad.<метка> = до/после   или   pad.<метка> = N  (одинаково с обеих сторон).
# Метки: highlight scenery people fish shot catch wildlife dive jump trick crash ride
# --pad-before / --pad-after в командной строке перекрывают и эти значения.
# pad.shot    = 6/3
# pad.catch   = 3/6
# pad.scenery = 4
# pad.people  = 7
 # pad.jump  = 10

# ---------------------------------------------------------------- клипы i/o и склейка
# Запас вокруг отрезков i/o, секунд
# clip_pad = 0.5
# Склеивать отрезки одного файла, если между ними ≤ N секунд
# merge_gap = 2

# ---------------------------------------------------------------- отбор
# Метки, которые клипов не дают (через запятую)
# exclude = bad
# Точечные метки, которые сами клипов не дают (внутри i/o только добавляют метку)
# point_exclude = dive
# Только файлы с оценкой ≥ N. Пусто/закомментировано — всё, кроме оценки 0; 0 — всё
# min_rating = 2

# ---------------------------------------------------------------- вывод
# Подпапка для клипов в папке футажа
# out = Clips

# ---------------------------------------------------------------- --reencode
# Качество H.264: меньше — лучше и больше файл (18 ≈ визуально без потерь, 23 — стандарт)
# reencode_crf = 18
# Скорость кодирования: ultrafast superfast veryfast faster fast medium slow slower veryslow
# reencode_preset = medium
