# mpv.conf — базовые настройки для просмотра и разметки футажа экшн-камер
# Путь: %APPDATA%\mpv\mpv.conf

# Аппаратное декодирование видеокартой. Нужно для HEVC 2.7K–5.3K с экшн-камер,
# иначе перемотка и 4x/8x тормозят. Проверка: Shift+I → строка «HW: d3d11va».
hwdec=auto-safe

# В конце КАЖДОГО файла остановиться на последнем кадре, а не уходить к следующему:
# сначала оценка 0–3 и Enter. (yes остановил бы только в конце последнего файла.)
# Скрипт camera_triage.lua включает это сам, строка здесь — для ясности.
keep-open=always

# Запоминать место в файле. При выходе (q, крестик) — эта строка;
# при переходе на другой файл (< >) место запоминает скрипт.
# Досмотренный до конца или отмеченный Enter файл при возврате начинается сначала.
# Вместе с местом mpv запоминает скорость и паузу.
save-position-on-quit=yes

# Окно не больше 90% экрана.
autofit-larger=90%x90%

# Чуть крупнее экранные сообщения.
osd-font-size=30

# Подстраивать воспроизведение под частоту монитора: плавнее 59.94 fps на 60 Гц,
# меньше пропущенных кадров (dropped output) на 1x. На 4x/8x пропуски на выводе
# неизбежны и нормальны — монитор физически не показывает 240 кадров/с.
video-sync=display-resample
