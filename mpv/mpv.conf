# mpv.conf — basic settings for watching and marking up action-camera footage
# Location: %APPDATA%\mpv\mpv.conf

# Hardware decoding on the GPU. Needed for 2.7K–5.3K HEVC from action cameras,
# otherwise seeking and 4x/8x stutter. Check: Shift+I → the line "HW: d3d11va".
hwdec=auto-safe

# Stop on the last frame at the end of EVERY file instead of moving to the next one:
# rate 0–3 and press Enter first. (yes would stop only at the end of the last file.)
# camera_triage.lua sets this itself; the line here is for clarity.
keep-open=always

# Remember the position in a file. On exit (q, window close) — this line;
# when switching to another file (< >) the script remembers the position.
# A file watched to the end or marked with Enter starts from the beginning when you come back.
# Along with the position mpv remembers the speed and pause state.
save-position-on-quit=yes

# Window no larger than 90% of the screen.
autofit-larger=90%x90%

# Slightly larger on-screen messages.
osd-font-size=30

# Match playback to the monitor refresh rate: smoother 59.94 fps on a 60 Hz display,
# fewer dropped output frames at 1x. At 4x/8x output drops are unavoidable and normal —
# a monitor physically cannot show 240 frames/s.
video-sync=display-resample
