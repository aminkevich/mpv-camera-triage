# Settings of the camera_triage.lua script (v3)
# Location: %APPDATA%\mpv\script-opts\camera_triage.conf
# Format: name=value, no spaces around "=". Lines starting with # are comments.
# yes/no to turn things on/off. Changes take effect after restarting mpv.

# ── Markup file ─────────────────────────────────────────────────────────────────
# CSV name. It is created IN THE VIDEO FOLDER and moves to the archive with it,
# so the CSV contains no paths — only file names.
# Only the script writes the CSV. You can view it in OnlyOffice/Excel but must not save it:
# a spreadsheet changes the time format and the delimiter, and after that the script
# refuses to write to such a file (protection against data corruption).
csv_name=_triage.csv

# On exit from mpv sort the CSV: by file, by time within a file,
# the rating last. While you work, rows are only appended to the end:
# nothing is lost on a crash, and undo (u) stays simple.
sort_on_exit=yes

# ── Markup ──────────────────────────────────────────────────────────────────────
# Activity at startup: spearfishing | kitesurfing | other.
# Written to every CSV row; changed in mpv with the a key.
activity=spearfishing

# Reaction-time correction, seconds. While the video plays, a mark is placed
# reaction_s × speed earlier than the key press (2 s earlier at 4x).
# While paused the time is written exactly. For important moments: pause → . , frame by frame → mark.
reaction_s=0.5

# ── Playback ────────────────────────────────────────────────────────────────────
# Speed that TAB switches to (a second TAB goes back to 1x).
# A speed ≠ 1x is always shown in large type in the top right corner.
fast_speed=4

# Full resolution or a low-resolution proxy.
# Many cameras write a light copy with the same timing next to every MP4:
#   GoPro — .LRV (GX010123.MP4 → GL010123.LRV)
#   DJI (Osmo Action etc.) — .LRF with the same name (DJI_…_D.MP4 → DJI_…_D.LRF)
# no  — watch the original MP4s in full resolution (recommended if playback is smooth:
#       small details — a fish in murky water, a kiter far away — can get lost in a proxy).
# yes — open the proxy instead of the MP4 if it is next to it (4K stutters, slow PC).
#       If a file has no proxy, the original is opened.
# During playback the mode is toggled with the L key (the current file reopens at the same position).
# The CSV always gets the MP4 name, and the src column records what you actually watched (mp4 / lrv / lrf).
# Time in the proxy and the original is the same, so marks apply to the original.
# (In v3.0 the option was called prefer_lrv — the old name still works.)
prefer_proxy=no

# A folder is opened as a whole: all videos are in the list, < > go through all of them.
# yes — on opening a folder, go straight to the first UNreviewed file
#       (reviewed = Enter was pressed); the status shows "reviewed N of M".
# no  — start with the file mpv opened (usually the first one).
skip_done=yes

# GoPro splits a long recording into chapters: GX010123, GX020123, … (01, 02 — chapter, 0123 — recording).
# By name mpv scatters them: GX010123, GX010124, …, with the continuation GX020123 at the end.
# yes — chapters of one recording follow each other in the playlist (and in the CSV after sorting); other files stay put.
gopro_order=yes

# What to drop from the playlist when a folder is opened: photos, camera service files
# (GoPro .THM, DJI .SRT etc.), the CSV itself. Proxies (.LRV/.LRF) are dropped separately
# when the original is next to them — no need to list them here.
skip_exts=thm,jpg,jpeg,gpr,dng,wav,csv,txt,md,ini,srt,xml

# ── Screen ──────────────────────────────────────────────────────────────────────
# How many seconds to show confirmations (● fish @ 00:01:29 etc.) in the top left corner.
osd_s=1.5

# Permanent status in the top right corner: file, reviewed or not, rating, marks, notes,
# "reviewed N of M", speed ≠ 1x, open clip.
status_bar=yes

# Earlier marks and notes pop up when the video passes them
# (not while seeking). They are always visible on the seek bar, and PgUp/PgDn jump between them.
show_marks=yes
