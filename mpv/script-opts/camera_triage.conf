# Настройки скрипта camera_triage.lua (v3)
# Путь: %APPDATA%\mpv\script-opts\camera_triage.conf
# Формат: имя=значение, без пробелов вокруг "=". Строки с # — комментарии.
# yes/no — для включения/выключения. Изменения действуют после перезапуска mpv.

# ── Файл разметки ───────────────────────────────────────────────────────────────
# Имя CSV. Создаётся В ПАПКЕ С ВИДЕО и переезжает вместе с ней в архив,
# поэтому в CSV нет путей — только имена файлов.
# CSV пишет только скрипт. В OnlyOffice/Excel его можно смотреть, но не сохранять:
# табличная программа меняет формат времени и разделитель, после этого скрипт
# в такой файл писать откажется (защита от порчи данных).
csv_name=_triage.csv

# При выходе из mpv отсортировать CSV: по файлу, внутри файла — по времени,
# в конце — оценка. Во время работы строки только дописываются в конец:
# так ничего не теряется при сбое, а отмена (u) работает просто.
sort_on_exit=yes

# ── Разметка ────────────────────────────────────────────────────────────────────
# Активность при запуске: spearfishing | kitesurfing | other.
# Пишется в каждую строку CSV; в mpv меняется клавишей a.
activity=spearfishing

# Поправка на реакцию, секунды. Пока видео идёт, метка ставится на
# reaction_s × скорость раньше нажатия (на 4x — на 2 с раньше).
# На паузе время пишется точно. Для важных моментов: пауза → . , по кадрам → метка.
reaction_s=0.5

# ── Просмотр ────────────────────────────────────────────────────────────────────
# Скорость, на которую переключает TAB (вторым TAB — обратно на 1x).
# Скорость ≠ 1x всегда видна крупно справа вверху.
fast_speed=4

# Полное разрешение или прокси (только GoPro).
# no  — смотреть оригинальные MP4 в полном разрешении (рекомендуется, если не тормозит:
#       мелкая рыба в мутной воде на прокси может теряться).
# yes — вместо MP4 открывать лёгкий .LRV, если он лежит рядом (для слабых ПК / 4K+).
#       mpv сам .LRV в плейлист не берёт, скрипт подменяет файл при открытии.
# В CSV в любом случае пишется имя MP4, а в колонке src — что реально смотрел (mp4/lrv).
# Время в LRV и MP4 совпадает, метки подходят к оригиналу.
prefer_lrv=no

# Папка открывается целиком: в списке все видео, < > ходят по всем.
# yes — при открытии папки сразу перейти к первому НЕпросмотренному файлу
#       (просмотренный = нажат Enter); статус показывает «просмотрено N из M».
# no  — начинать с того файла, который открыл mpv (обычно первый).
skip_done=yes

# Что убрать из плейлиста при открытии папки: фото, служебные файлы камер
# (GoPro .THM, DJI .SRT/.LRF и т.п.), сам CSV.
skip_exts=thm,jpg,jpeg,gpr,dng,wav,csv,txt,md,ini,srt,lrf,xml

# ── Экран ───────────────────────────────────────────────────────────────────────
# Сколько секунд показывать подтверждения (● fish @ 00:01:29 и т.п.) слева вверху.
osd_s=1.5

# Постоянный статус справа вверху: файл, просмотрен/нет, оценка, метки, заметки,
# «просмотрено N из M», скорость ≠ 1x, открытый клип.
status_bar=yes

# Ранее поставленные метки и заметки всплывают, когда видео проходит через них
# (при перемотке — нет). На полосе прокрутки они видны всегда, PgUp/PgDn прыгают по ним.
show_marks=yes
